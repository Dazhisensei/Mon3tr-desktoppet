[package]
name = "desktop-pet"
version = "0.1.1"
description = "桌宠 - Desktop Pet"
authors = ["you"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "desktop_pet_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# 原生右键菜单需要直接调用 Win32 API：
# Tauri 的 menu.popup() 会阻塞主线程且不派发菜单事件，
# 因此改为自行调用 TrackPopupMenu（详见 lib.rs 的 show_context_menu）
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
